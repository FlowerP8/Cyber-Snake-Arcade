<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake Arcade</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 10px #00f2fe;
        }

        #score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
        }

        .score-box {
            background: #161b22;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #30363d;
        }

        #score { color: #4facfe; font-weight: bold; }
        #highscore { color: #00f2fe; font-weight: bold; }

        #game-container {
            position: relative;
            border: 4px solid #30363d;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
            border-radius: 8px;
            background-color: #040d21;
        }

        canvas {
            display: block;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #game-over-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over-screen h2 {
            color: #ff4757;
            font-size: 3rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px #ff4757;
        }

        .btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: #000;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        #controls-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <h1>Cyber Snake</h1>

    <div id="score-board">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">Highscore: <span id="highscore">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-screen" class="visible">
            <h2 id="over-text">Start Spel</h2>
            <button class="btn" id="start-btn">SPEEL</button>
        </div>
    </div>

    <div id="controls-hint">Gebruik de <b>pijltjestoetsen</b> of <b>W-A-S-D</b> om te sturen.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highscoreElement = document.getElementById("highscore");
        const gameOverScreen = document.getElementById("game-over-screen");
        const startBtn = document.getElementById("start-btn");
        const overText = document.getElementById("over-text");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highscore = localStorage.getItem("snake_highscore") || 0;
        let gameInterval;
        let gameRunning = false;
        let changingDirection = false;

        highscoreElement.innerText = highscore;

        startBtn.addEventListener("click", startGame);

        function startGame() {
            snake = [
                { x: gridSize * 5, y: gridSize * 5 },
                { x: gridSize * 4, y: gridSize * 5 },
                { x: gridSize * 3, y: gridSize * 5 }
            ];
            score = 0;
            dx = gridSize;
            dy = 0;
            scoreElement.innerText = score;
            gameOverScreen.classList.remove("visible");
            gameRunning = true;
            resetFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(update, 100);
        }

        function update() {
            if (hasGameEnded()) {
                endGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#040d21";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00f2fe" : "#4facfe";
                ctx.shadowBlur = index === 0 ? 10 : 0;
                ctx.shadowColor = "#00f2fe";
                
                ctx.beginPath();
                ctx.roundRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function moveSnake() {
            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            // Teleportatie logica door de muren heen
            if (headX < 0) headX = canvas.width - gridSize;
            else if (headX >= canvas.width) headX = 0;

            if (headY < 0) headY = canvas.height - gridSize;
            else if (headY >= canvas.height) headY = 0;

            const head = { x: headX, y: headY };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = score;
                if (score > highscore) {
                    highscore = score;
                    highscoreElement.innerText = highscore;
                    localStorage.setItem("snake_highscore", highscore);
                }
                resetFood();
            } else {
                snake.pop();
            }
        }

        function resetFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) resetFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff4757";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff4757";
            ctx.beginPath();
            ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function hasGameEnded() {
            if (snake.length === 0) return false;

            // Alleen doodgaan als je je eigen lichaam raakt (vanaf het 5e segment)
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            return false;
        }

        function endGame() {
            clearInterval(gameInterval);
            gameRunning = false;
            overText.innerText = "Game Over";
            startBtn.innerText = "OPNIEUW";
            gameOverScreen.classList.add("visible");
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (!gameRunning || changingDirection) return;

            const keyPressed = event.keyCode;
            
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if ((keyPressed === 37 || keyPressed === 65) && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 38 || keyPressed === 87) && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if ((keyPressed === 39 || keyPressed === 68) && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 40 || keyPressed === 83) && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }
    </script>
</body>
</html>
